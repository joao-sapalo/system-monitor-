#!/bin/bash
# =============================================================================
# Configuracao do Monitor de Sistema
# =============================================================================

# --- Limites de uso (percentagem) ---
CPU_MAX=80
MEM_MAX=85
DISK_MAX=90

# --- Limpeza de memoria RAM ---
# Percentagem de uso que activa a limpeza automatica
MEM_LIMPAR=70

# --- Servicos systemd a monitorar (separados por espaco) ---
SERVICOS_MONITORAR="nginx postgresql ssh"

# --- Notificacoes locais (sem redes sociais) ---
# Notificacao desktop (popup no ecrã - requer notify-send / ambiente grafico)
NOTIFICAR_DESKTOP=true
# Alerta sonoro (beep ou aplay - so funciona com desktop)
NOTIFICAR_SOM=false

# --- Notificacoes externas (opcional) ---
NOTIFICAR_TELEGRAM=false
NOTIFICAR_EMAIL=false

# Telegram Bot API
TELEGRAM_BOT_TOKEN="SEU_BOT_TOKEN_AQUI"
TELEGRAM_CHAT_ID="SEU_CHAT_ID_AQUI"

# Email (via msmtp/sendmail)
EMAIL_DESTINATARIO="admin@exemplo.com"
EMAIL_REMETENTE="monitor@exemplo.com"

# --- Logging ---
LOG_DIR="logs"
LOG_FILE="${LOG_DIR}/monitor.log"
LOG_DIAS_RETENCAO=7
